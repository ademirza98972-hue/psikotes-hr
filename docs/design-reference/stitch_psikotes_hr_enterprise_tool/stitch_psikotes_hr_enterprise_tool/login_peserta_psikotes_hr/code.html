<!DOCTYPE html>

<html class="light" lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Psikotes HR</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary": "#603716",
                    "primary": "#0d4757",
                    "on-primary-fixed": "#001f28",
                    "secondary-fixed": "#dde4e5",
                    "surface-variant": "#e0e3e5",
                    "primary-fixed-dim": "#9ccee1",
                    "on-tertiary-fixed-variant": "#663d1b",
                    "secondary-container": "#dae1e2",
                    "outline": "#71787c",
                    "surface-container-highest": "#e0e3e5",
                    "on-surface-variant": "#40484b",
                    "on-background": "#191c1e",
                    "on-primary-fixed-variant": "#164d5c",
                    "on-tertiary-container": "#ffc398",
                    "inverse-surface": "#2d3133",
                    "tertiary-fixed-dim": "#f7ba8e",
                    "on-secondary-fixed": "#161d1e",
                    "surface-tint": "#326575",
                    "on-secondary-fixed-variant": "#414849",
                    "surface-bright": "#f7f9fb",
                    "on-secondary": "#ffffff",
                    "on-error": "#ffffff",
                    "tertiary-container": "#7b4e2b",
                    "inverse-primary": "#9ccee1",
                    "on-secondary-container": "#5d6465",
                    "tertiary-fixed": "#ffdcc5",
                    "primary-fixed": "#b8eafd",
                    "background": "#f7f9fb",
                    "on-tertiary-fixed": "#301400",
                    "outline-variant": "#c0c8cb",
                    "surface-container-high": "#e6e8ea",
                    "on-surface": "#191c1e",
                    "secondary-fixed-dim": "#c1c8c9",
                    "surface-container": "#eceef0",
                    "surface": "#f7f9fb",
                    "error": "#ba1a1a",
                    "inverse-on-surface": "#eff1f3",
                    "on-primary": "#ffffff",
                    "surface-dim": "#d8dadc",
                    "error-container": "#ffdad6",
                    "on-primary-container": "#a5d7ea",
                    "on-error-container": "#93000a",
                    "surface-container-low": "#f2f4f6",
                    "on-tertiary": "#ffffff",
                    "primary-container": "#2c5f6f",
                    "surface-container-lowest": "#ffffff",
                    "secondary": "#586061"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "container-max-width": "720px",
                    "gutter-md": "1.5rem",
                    "gap-stack-xl": "3rem",
                    "margin-page": "2rem"
            },
            "fontFamily": {
                    "headline-md": ["Work Sans"],
                    "timer-display": ["Work Sans"],
                    "body-lg": ["Work Sans"],
                    "label-caps": ["Work Sans"],
                    "display-lg": ["Work Sans"],
                    "body-md": ["Work Sans"]
            },
            "fontSize": {
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "timer-display": ["20px", {"lineHeight": "24px", "letterSpacing": "0.01em", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "display-lg": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #f8fafc; /* Slate-50 fallback */
            font-family: 'Work Sans', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .input-field {
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-field:focus {
            outline: none;
            border-color: #0d4757;
            box-shadow: 0 0 0 2px rgba(13, 71, 87, 0.1);
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar Shell (Suppressed Labels, only Brand) -->
<header class="bg-surface w-full px-margin-page py-6 max-w-container-max-width mx-auto flex justify-center items-center">
<h1 class="text-headline-md font-headline-md font-bold text-primary">Psikotes HR</h1>
</header>
<main class="flex-grow flex items-center justify-center px-4 py-12">
<div class="w-full max-w-[440px] flex flex-col gap-8">
<!-- Login Form Card -->
<section class="bg-surface-container-lowest p-8 rounded-xl border border-outline-variant shadow-sm">
<div class="mb-8">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Selamat Datang</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Silakan masuk untuk memulai sesi penilaian Anda.</p>
</div>
<form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="identity">NIK ATAU EMAIL</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">person</span>
<input class="input-field w-full pl-10 pr-4 py-3 rounded-lg border border-outline-variant bg-surface font-body-md text-body-md" id="identity" name="identity" placeholder="Contoh: 327123456789" type="text"/>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="password">KATA SANDI</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">lock</span>
<input class="input-field w-full pl-10 pr-12 py-3 rounded-lg border border-outline-variant bg-surface font-body-md text-body-md" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<div class="flex justify-end">
<a class="font-label-caps text-label-caps text-primary hover:underline" href="#">Lupa Kata Sandi?</a>
</div>
</div>
<button class="bg-primary text-on-primary font-body-lg text-body-lg py-4 rounded-lg shadow-md hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                        Masuk
                        <span class="material-symbols-outlined">login</span>
</button>
</form>
</section>
<!-- Registration Section -->
<section class="flex flex-col gap-6">
<div class="flex items-center gap-4">
<div class="h-px bg-outline-variant flex-grow"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant">BELUM MEMILIKI AKUN?</span>
<div class="h-px bg-outline-variant flex-grow"></div>
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<!-- Register as Employee -->
<button class="flex flex-col items-center justify-center p-6 bg-surface-container-low border border-outline-variant rounded-xl hover:border-primary hover:bg-secondary-container transition-all group">
<div class="w-12 h-12 rounded-full bg-secondary-container group-hover:bg-primary-container flex items-center justify-center mb-3 transition-colors">
<span class="material-symbols-outlined text-primary group-hover:text-on-primary-container">badge</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface mb-1">KARYAWAN</span>
<span class="font-body-md text-[14px] text-on-surface-variant text-center">Daftar dengan NIK</span>
</button>
<!-- Register as Candidate -->
<button class="flex flex-col items-center justify-center p-6 bg-surface-container-low border border-outline-variant rounded-xl hover:border-primary hover:bg-secondary-container transition-all group">
<div class="w-12 h-12 rounded-full bg-secondary-container group-hover:bg-primary-container flex items-center justify-center mb-3 transition-colors">
<span class="material-symbols-outlined text-primary group-hover:text-on-primary-container">person_add</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface mb-1">KANDIDAT</span>
<span class="font-body-md text-[14px] text-on-surface-variant text-center">Daftar untuk Rekrutmen</span>
</button>
</div>
</section>
</div>
</main>
<!-- Footer Identity -->
<footer class="py-8 px-margin-page text-center">
<p class="font-label-caps text-label-caps text-on-surface-variant opacity-60">
            © 2024 Psikotes HR. All rights reserved. <br/>
            Sistem Penilaian Psikometri Profesional
        </p>
</footer>
<!-- Simple Interaction Script -->
<script>
        // Toggle password visibility
        const toggleBtn = document.querySelector('button[type="button"]');
        const passInput = document.querySelector('#password');
        
        toggleBtn.addEventListener('click', () => {
            const isPassword = passInput.type === 'password';
            passInput.type = isPassword ? 'text' : 'password';
            toggleBtn.querySelector('.material-symbols-outlined').textContent = isPassword ? 'visibility_off' : 'visibility';
        });

        // Add subtle scale animation to registration cards
        const regCards = document.querySelectorAll('section.grid > button');
        regCards.forEach(card => {
            card.addEventListener('mousedown', () => card.style.transform = 'scale(0.97)');
            card.addEventListener('mouseup', () => card.style.transform = 'scale(1)');
            card.addEventListener('mouseleave', () => card.style.transform = 'scale(1)');
        });
    </script>
</body></html>
