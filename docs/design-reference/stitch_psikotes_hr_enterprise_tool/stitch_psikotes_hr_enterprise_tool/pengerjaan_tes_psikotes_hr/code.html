<style>
        body {
            background-color: #f7f9fb;
            font-family: 'Work Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .choice-card-selected {
            background-color: #E9F0F1;
            border: 2px solid #0d4757;
        }
        .choice-card-neutral {
            background-color: #ffffff;
            border: 1px solid #e0e3e5;
        }
        .progress-bar-fill {
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>

<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface docked full-width top-0 z-50">
<div class="flex justify-between items-center w-full px-margin-page py-4 max-w-container-max-width mx-auto">
<h1 class="text-headline-md font-headline-md font-bold text-primary dark:text-primary-fixed-dim">Psikotes HR</h1>
<div class="flex items-center gap-4">
<button class="hover:bg-surface-container-low transition-colors p-2 rounded-full scale-95 duration-100">
<span class="material-symbols-outlined text-on-surface-variant">help</span>
</button>
<button class="hover:bg-surface-container-low transition-colors p-2 rounded-full scale-95 duration-100">
<span class="material-symbols-outlined text-on-surface-variant">logout</span>
</button>
<div class="w-10 h-10 rounded-full bg-surface-container-high overflow-hidden border border-outline-variant">
<img class="w-full h-full object-cover" data-alt="A professional studio portrait of a corporate participant, clean lighting, soft grey background, wearing business casual attire. The image is minimalist and focused, aligning with a modern corporate psychometric testing interface style with a calm and professional atmosphere." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBFi9rit8mwymgH8NKM_SR-X__wLtbSyK4gTCF2Xjr4n-Is237Cywt5mKNcTDHT4Ue3zngnXXgcjDeub9_laa53C47VAGgtJWIxZ7VK-Tpm43S_3eBIElI0zUpcxHPw4vX9C0kMMwLn-VWgOX1EBOrWVRILnb16c0qX6Zxwm79nm69heAlAuuXqM2q3fSf2Q8Cw1ghJLmrA2OLAjacHTEdrXasIR7pBbuVFXWvn2m1XJnDHG888ffrh"/>
</div>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center px-4 md:px-margin-page pt-8 pb-32">
<div class="w-full max-w-container-max-width space-y-gap-stack-xl">
<!-- Progress & Timer Section -->
<div class="space-y-4">
<div class="flex justify-between items-end">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Soal 12 dari 30</span>
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined text-[20px]">timer</span>
<span class="font-timer-display text-timer-display" id="timer">18:45</span>
</div>
</div>
<div class="h-2 w-full bg-secondary-container rounded-full overflow-hidden">
<div class="h-full bg-primary progress-bar-fill" style="width: 40%;"></div>
</div>
</div>
<!-- Question Area -->
<section class="text-center space-y-4">
<h2 class="font-headline-md text-headline-md text-on-surface">Pilih salah satu pernyataan yang paling menggambarkan diri Anda:</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Kedua pernyataan mungkin terasa benar, namun pilihlah satu yang paling dominan.</p>
</section>
<!-- Choice Cards (Forced Choice) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Card A: Selected State -->
<button class="choice-card-selected group p-8 rounded-xl flex flex-col items-center justify-center text-center transition-all duration-200 active:scale-98 min-h-[220px]" onclick="selectChoice(this)">
<div class="w-12 h-12 rounded-full bg-primary flex items-center justify-center mb-6">
<span class="text-white font-bold font-headline-md">A</span>
</div>
<p class="font-body-lg text-body-lg text-on-surface">"Saya suka menolong teman yang sedang kesusahan."</p>
<div class="mt-6 opacity-100 transition-opacity">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Card B: Neutral State -->
<button class="choice-card-neutral group p-8 rounded-xl flex flex-col items-center justify-center text-center transition-all duration-200 active:scale-98 min-h-[220px] hover:border-primary/50" onclick="selectChoice(this)">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center mb-6 group-hover:bg-secondary-container transition-colors">
<span class="text-on-surface-variant font-bold font-headline-md">B</span>
</div>
<p class="font-body-lg text-body-lg text-on-surface">"Saya suka mengerjakan tugas tepat waktu."</p>
<div class="mt-6 opacity-0 transition-opacity">
<span class="material-symbols-outlined text-primary">check_circle</span>
</div>
</button>
</div>
</div>
</main>
<!-- BottomNavBar -->
<footer class="fixed bottom-0 left-0 w-full z-50 bg-surface dark:bg-surface">
<div class="flex justify-between items-center px-margin-page py-6 max-w-container-max-width mx-auto">
<!-- Previous Button -->
<button class="bg-secondary-container text-on-secondary-container rounded-lg px-8 py-3 min-h-[56px] flex items-center justify-center gap-2 hover:opacity-90 transition-opacity active:scale-98 font-label-caps text-label-caps">
<span class="material-symbols-outlined">chevron_left</span>
                Previous
            </button>
<!-- Next Button -->
<button class="bg-primary text-on-primary rounded-lg px-10 py-3 min-h-[56px] flex items-center justify-center gap-2 hover:opacity-90 transition-opacity active:scale-98 font-label-caps text-label-caps shadow-lg shadow-primary/10">
                Next
                <span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
</footer>
<script>
        // Simple Interaction Logic
        function selectChoice(element) {
            // Reset all cards
            const cards = document.querySelectorAll('button[onclick="selectChoice(this)"]');
            cards.forEach(card => {
                card.classList.remove('choice-card-selected');
                card.classList.add('choice-card-neutral');
                card.querySelector('div:first-child').classList.replace('bg-primary', 'bg-surface-container-highest');
                card.querySelector('div:first-child span').classList.replace('text-white', 'text-on-surface-variant');
                card.querySelector('div:last-child').classList.add('opacity-0');
                card.querySelector('div:last-child').classList.remove('opacity-100');
                card.querySelector('div:last-child span').style.fontVariationSettings = "'FILL' 0";
            });

            // Select clicked card
            element.classList.remove('choice-card-neutral');
            element.classList.add('choice-card-selected');
            element.querySelector('div:first-child').classList.replace('bg-surface-container-highest', 'bg-primary');
            element.querySelector('div:first-child span').classList.replace('text-on-surface-variant', 'text-white');
            element.querySelector('div:last-child').classList.remove('opacity-0');
            element.querySelector('div:last-child').classList.add('opacity-100');
            element.querySelector('div:last-child span').style.fontVariationSettings = "'FILL' 1";
        }

        // Timer countdown mock
        let time = 1125; // 18:45 in seconds
        const timerElement = document.getElementById('timer');
        
        setInterval(() => {
            if (time > 0) {
                time--;
                const minutes = Math.floor(time / 60);
                const seconds = time % 60;
                timerElement.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                
                // Color warning
                if (time < 120) {
                    timerElement.parentElement.classList.replace('text-primary', 'text-error');
                }
            }
        }, 1000);
    </script>
</body></html>
